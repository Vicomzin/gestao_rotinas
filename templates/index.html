<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Rotinas</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            padding: 40px; 
            background-color: #f4f4f9; 
            margin: 0;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
        }
        /* Container para deixar os 3 cartões lado a lado */
        .dashboard {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 8px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            width: 320px; 
            box-sizing: border-box;
        }
        h2 { 
            margin-top: 0; 
            font-size: 20px;
            color: #444;
        }
        input, button { 
            padding: 10px; 
            margin-top: 12px; 
            width: 100%; 
            box-sizing: border-box; 
            border-radius: 4px;
        }
        input {
            border: 1px solid #ccc;
        }
        button { 
            color: white; 
            border: none; 
            cursor: pointer; 
            font-weight: bold;
        }
        .btn-verde { background-color: #28a745; }
        .btn-verde:hover { background-color: #218838; }
        
        .btn-azul { background-color: #007bff; }
        .btn-azul:hover { background-color: #0069d9; }
        
        .btn-laranja { background-color: #fd7e14; }
        .btn-laranja:hover { background-color: #d36611; }

        .msg { 
            margin-top: 15px; 
            font-weight: bold; 
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h1>Painel de Controle de Rotinas</h1>

    <div class="dashboard">
        
        <div class="card">
            <h2>1. Cadastrar Usuário</h2>
            <input type="text" id="userInput" placeholder="Nome do usuário">
            <button class="btn-verde" onclick="criarUsuario()">Salvar Usuário</button>
            <p id="msgUser" class="msg"></p>
        </div>

        <div class="card">
            <h2>2. Criar Nova Rotina</h2>
            <input type="number" id="rotinaUserId" placeholder="ID do Usuário (Ex: 1)">
            <input type="text" id="rotinaNomeInput" placeholder="Nome da Rotina (Ex: Exercícios)">
            
            <div style="text-align: left; margin-top: 10px; margin-bottom: 15px;">
                <label style="font-size: 0.9em; color: #555;">Frequência:</label>
                <select id="frequencia" style="width: 100%; padding: 8px; margin-top: 4px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="Diária">Diária</option>
                    <option value="Dias Úteis">Dias Úteis</option>
                    <option value="Finais de Semana">Finais de Semana</option>
                </select>

                <label style="font-size: 0.9em; color: #555;">Período:</label>
                <select id="periodo" style="width: 100%; padding: 8px; margin-top: 4px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="Livre">Livre</option>
                    <option value="Manhã">Manhã</option>
                    <option value="Tarde">Tarde</option>
                    <option value="Noite">Noite</option>
                </select>

                <label style="font-size: 0.9em; color: #555;">Prioridade:</label>
                <select id="prioridade" style="width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;">
                    <option value="Alta">Alta</option>
                    <option value="Média" selected>Média</option>
                    <option value="Baixa">Baixa</option>
                </select>
            </div>
            <button class="btn-azul" onclick="criarRotina()">Salvar Rotina</button>
            <p id="msgRotina" class="msg"></p>
        </div>

        <div class="card">
            <h2>3. Adicionar Exercícios</h2>
            <input type="number" id="exercicioRotinaId" placeholder="ID da Rotina (Ex: 1)">
            <input type="text" id="exercicioNomeInput" placeholder="Ex: 15 Flexões">
            <button class="btn-azul" style="background-color: #17a2b8;" onclick="criarExercicio()">Salvar Exercício</button>
            <p id="msgExercicio" class="msg"></p>
        </div>

        <div class="card" style="grid-column: 1 / -1;">
            <h2>4. Minhas Rotinas e Execução</h2>
            <div style="display: flex; gap: 10px; justify-content: center; align-items: center;">
                <input type="number" id="buscaUserId" placeholder="Seu ID de Usuário (Ex: 1)" style="width: 200px; margin: 0;">
                <button class="btn-verde" style="width: auto; margin: 0;" onclick="buscarMinhasRotinas()">Buscar Minhas Rotinas</button>
            </div>
            <p id="msgBusca" class="msg"></p>
            
            <div id="listaRotinasVisualizacao" style="margin-top: 15px;"></div>
            <p id="msgExecucao" class="msg"></p>
        </div>

    </div>

    <script>
// 1. FUNÇÃO PARA CRIAR USUÁRIO
        async function criarUsuario() {
            const username = document.getElementById('userInput').value;
            const msg = document.getElementById('msgUser');

            if (!username) { msg.style.color = "red"; msg.innerText = "Digite um nome."; return; }

            try {
                const response = await fetch('/api/usuarios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username })
                });
                const data = await response.json();
                
                if (response.status === 201) {
                    msg.style.color = "green";
                    msg.innerText = `Sucesso! Usuário criado com ID: ${data.id}`;
                    document.getElementById('userInput').value = '';
                } else {
                    // A MÁGICA ESTÁ AQUI: Agora ele lê a mensagem exata do seu Python (data.message)
                    msg.style.color = "red"; 
                    msg.innerText = data.message;
                }
            } catch (e) { msg.style.color = "red"; msg.innerText = "Erro de conexão."; }
        }

        // 2. FUNÇÃO PARA CRIAR ROTINA (VERSÃO 2.0)
        async function criarRotina() {
            const userId = document.getElementById('rotinaUserId').value;
            const nomeRotina = document.getElementById('rotinaNomeInput').value;
            
            // Captura os novos campos da Versão 2.0
            const freq = document.getElementById('frequencia') ? document.getElementById('frequencia').value : 'Diária';
            const per = document.getElementById('periodo') ? document.getElementById('periodo').value : 'Livre';
            const prio = document.getElementById('prioridade') ? document.getElementById('prioridade').value : 'Média';

            const msg = document.getElementById('msgRotina');

            if (!userId || !nomeRotina) { msg.style.color = "red"; msg.innerText = "Preencha todos os campos base."; return; }

            try {
                const response = await fetch('/api/rotinas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        user_id: parseInt(userId), 
                        name: nomeRotina,
                        frequencia: freq,
                        periodo: per,
                        prioridade: prio
                    })
                });
                const data = await response.json();
                if (response.status === 201) {
                    msg.style.color = "green";
                    msg.innerText = `Sucesso! Rotina criada com ID: ${data.id}`;
                    document.getElementById('rotinaUserId').value = '';
                    document.getElementById('rotinaNomeInput').value = '';
                } else {
                    msg.style.color = "red"; msg.innerText = "Erro ao criar rotina.";
                }
            } catch (e) { msg.style.color = "red"; msg.innerText = "Erro de conexão."; }
        }

        // 3. FUNÇÃO PARA REGISTRAR EXECUÇÃO
        async function ejecutarRotina() {
            const rotinaId = document.getElementById('execucaoRotinaId').value;
            const msg = document.getElementById('msgExecucao');

            if (!rotinaId) { msg.style.color = "red"; msg.innerText = "Digite o ID da rotina."; return; }

            try {
                const response = await fetch('/api/rotinas/executar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ routine_id: parseInt(rotinaId) })
                });
                const data = await response.json();
                
                if (response.status === 201) {
                    msg.style.color = "green";
                    msg.innerText = data.message;
                    document.getElementById('execucaoRotinaId').value = '';
                } else {
                    // Aqui a tela mostra o erro que o seu backend gerou (duplicidade ou inativa)
                    msg.style.color = "red";
                    msg.innerText = data.error;
                }
            } catch (e) { msg.style.color = "red"; msg.innerText = "Erro de conexão."; }
        }

        // 3. FUNÇÃO PARA ADICIONAR EXERCÍCIO À ROTINA
        async function criarExercicio() {
            const routineId = document.getElementById('exercicioRotinaId').value;
            const nomeExercicio = document.getElementById('exercicioNomeInput').value;
            const msg = document.getElementById('msgExercicio');

            if (!routineId || !nomeExercicio) { msg.style.color = "red"; msg.innerText = "Preencha todos os campos."; return; }

            try {
                const response = await fetch('/api/exercicios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ routine_id: parseInt(routineId), name: nomeExercicio })
                });
                if (response.status === 201) {
                    msg.style.color = "green";
                    msg.innerText = "Sucesso! Exercício adicionado.";
                    document.getElementById('exercicioNomeInput').value = '';
                } else {
                    msg.style.color = "red"; msg.innerText = "Erro ao adicionar exercício.";
                }
            } catch (e) { msg.style.color = "red"; msg.innerText = "Erro de conexão."; }
        }

        // 4. FUNÇÃO PARA BUSCAR E VISUALIZAR AS ROTINAS (O SEU PEDIDO!)
        async function buscarMinhasRotinas() {
            const userId = document.getElementById('buscaUserId').value;
            const container = document.getElementById('listaRotinasVisualizacao');
            const msg = document.getElementById('msgBusca');
            
            if (!userId) { msg.style.color = "red"; msg.innerText = "Digite o ID do Usuário."; return; }
            
            container.innerHTML = "Carregando...";
            try {
                const response = await fetch(`/api/rotinas/${userId}`);
                const data = await response.json();
                
                if (response.ok && data.rotinas) {
                    container.innerHTML = ""; // Limpa o carregando
                    if (data.rotinas.length === 0) {
                        container.innerHTML = "<p>Nenhuma rotina encontrada.</p>";
                        return;
                    }
                    
                    // Desenha cada rotina e os seus exercícios na ecrã
                    data.rotinas.forEach(rotina => {
                        let exerciciosHTML = rotina.exercicios.map(ex => `<li>${ex.name}</li>`).join('');
                        if(exerciciosHTML === '') exerciciosHTML = "<li>Nenhum exercício cadastrado ainda.</li>";

                        container.innerHTML += `
                            <div style="border: 1px solid #ccc; padding: 10px; margin-top: 10px; border-radius: 5px; text-align: left;">
                                <strong>[ID: ${rotina.id}] ${rotina.name}</strong><br>
                                <span style="font-size: 0.8em; color: #666;">${rotina.frequencia} | ${rotina.periodo} | Prioridade: ${rotina.prioridade}</span>
                                <ul style="font-size: 0.9em; margin-top: 5px; margin-bottom: 10px;">
                                    ${exerciciosHTML}
                                </ul>
                                <button class="btn-laranja" onclick="executarRotina(${rotina.id})">Executar Esta Rotina</button>
                            </div>
                        `;
                    });
                    msg.innerText = "";
                } else {
                    container.innerHTML = "";
                    msg.style.color = "red"; msg.innerText = "Erro ao buscar rotinas.";
                }
            } catch (e) { 
                container.innerHTML = "";
                msg.style.color = "red"; msg.innerText = "Erro de conexão."; 
            }
        }
    </script>
</body>
</html>
